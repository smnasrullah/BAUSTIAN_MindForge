# Bangladesh public holidays used by the LIVE synthetic data generator (clock mode "live").
#
# How it is used
# - On a fresh live database these rows become events (admin -> Events page, where an admin can
#   edit, add or delete them; the forecast reads the events table).
# - The synthetic "world" (the generated transactions) follows this file: banks closed, demand
#   multipliers (docs/SYNTHETIC_ASSUMPTIONS.md). Edit it and restart with a fresh database to
#   change the world; edits on the Events page change what the forecast knows, not past data.
#
# status
# - fixed_date: same Gregorian date every year (long-standing national days).
# - unverified: computed offline with the arithmetic (tabular) Hijri calendar. The real date in
#   Bangladesh depends on moon sighting and can differ by a day. Checked against 2025 only
#   (Eid-ul-Fitr 31 Mar 2025 and Eid-ul-Adha 7 Jun 2025 match). Please verify before relying on it.
#
# Not included (cannot be derived offline; add them by hand or on the Events page):
# Durga Puja / Bijoya Dashami, Buddha Purnima, Janmashtami, Shab-e-Barat, Shab-e-Qadr,
# Jumatul Bidah, and days whose status changed by government order in 2024-25 (17 Mar, 15 Aug).
#
# kind: holiday (one day off) | eid (pre-Eid rush and a run of bank holidays around the day)

